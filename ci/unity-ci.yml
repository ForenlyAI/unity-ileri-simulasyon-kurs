# Unity CI, generated by `unity ci init`.
#
# Repository secrets this workflow reads (Settings -> Secrets and variables -> Actions):
#
#   UNITY_SERVICE_ACCOUNT_ID      Service-account key ID, from Unity Cloud ->
#   UNITY_SERVICE_ACCOUNT_SECRET  Administration -> Service accounts -> Keys.
#                                 The CLI reads these two straight from the
#                                 environment, so no sign-in step is needed and
#                                 no secret is ever passed on a command line.
#
#   UNITY_LICENSE_SERIAL          A Unity license serial. Service-account auth
#                                 covers Unity *services* only -- the Editor
#                                 still needs its own license to run a build.
#                                 See the "Activate the Unity license" step for
#                                 the other unattended options.
#
# Every `unity` command below runs non-interactively and propagates its exit
# code, so a failed test or build fails the job. Reserved Editor flags
# (-batchmode, -quit, -projectPath) are managed by the CLI and must not be
# passed to `unity build` / `unity test`.

name: Unity

on:
  # Every branch, not just one name. A generated workflow cannot know what this
  # repository calls its default branch -- `main`, `master`, `develop`, a
  # trunk-per-team scheme -- and a name that does not match means the workflow
  # silently never runs on push. Narrow this to your own branches when you know
  # them.
  push:
  pull_request:

concurrency:
  group: unity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity:
    runs-on: ubuntu-latest

    # Every `unity` command below runs in the Unity project. `unity ci init`
    # fills this in relative to the repository root, so it is `.` for a
    # single-project repository and the project's subdirectory in a monorepo.
    defaults:
      run:
        # Quoted: `@` is a reserved YAML indicator, so the placeholder has to
        # be a quoted scalar for the template to parse before substitution.
        working-directory: '.'

    env:
      UNITY_SERVICE_ACCOUNT_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_ID }}
      UNITY_SERVICE_ACCOUNT_SECRET: ${{ secrets.UNITY_SERVICE_ACCOUNT_SECRET }}
      # Report failures as GitHub Actions annotations, so a red step says what
      # went wrong in the run summary instead of only inside the log.
      UNITY_FORMAT: github
      # Presence-checked by the CLI's global --non-interactive mirror, and
      # value-checked ("1") by the first-run consent gate. "1" satisfies both.
      UNITY_NON_INTERACTIVE: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Mask credentials in logs
        run: |
          echo "::add-mask::$UNITY_SERVICE_ACCOUNT_ID"
          echo "::add-mask::$UNITY_SERVICE_ACCOUNT_SECRET"

      - name: Install the Unity CLI
        run: |
          curl -fsSL https://unity.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The Editor installer archives, so a re-run does not re-download them.
      - name: Restore the Unity download cache
        uses: actions/cache@v4
        with:
          path: ~/.config/unityhub/downloads
          key: unity-downloads-6000.3.26f1

      # `unity cache key` hashes only what actually invalidates a Library/
      # folder: the Editor version, the resolved package set, and the build
      # target. Editing a scene or a script keeps the cache that is still valid
      # for it.
      - name: Compute the Library cache key
        id: cache-key
        run: echo "key=$(unity cache key --target WebGL)" >> "$GITHUB_OUTPUT"

      # Project-relative, unlike the `run` steps above. `defaults.run` sets the
      # working directory for RUN steps only, so an action's `path` is resolved
      # against the workspace root -- in a monorepo an unprefixed `Library`
      # names a directory that does not exist, and the cache silently stores
      # nothing.
      - name: Restore the project Library folder
        uses: actions/cache@v4
        with:
          path: './Library'
          key: unity-library-${{ steps.cache-key.outputs.key }}

      # The Editor is a desktop application even in batch mode, and the hosted
      # runner image does not carry its shared libraries -- without these it
      # exits before printing anything useful. Names are the Ubuntu 24.04
      # (noble) spellings, matching `runs-on: ubuntu-latest`; on an older image
      # the `t64` packages are named without that suffix.
      - name: Install the Editor's runtime libraries
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libgtk-3-0t64 libnss3 \
            libasound2t64 libgbm1 libdrm2 libxtst6 \
            libxrandr2 libxcursor1 libxcomposite1 libxdamage1 \
            libxfixes3 libxi6 libxrender1 libxext6 \
            libsm6 libice6 libxkbcommon0 libpango-1.0-0 \
            libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 libatk1.0-0t64 \
            libatk-bridge2.0-0t64 libcups2t64 libdbus-1-3 libnotify4 \
            libsecret-1-0

      - name: Install the Unity Editor
        run: unity install 6000.3.26f1 --yes --accept-eula --module webgl

      # Unattended alternatives, in place of the serial below:
      #
      #   Floating license server:
      #     unity license activate --floating
      #
      #   Offline license file, from a base64 secret:
      #     printf '%s' "${{ secrets.UNITY_LICENSE_FILE_BASE64 }}" | base64 -d > unity.ulf
      #     unity license activate --file unity.ulf
      #
      # `unity license activate --personal` does NOT work here: Unity's
      # licensing backend rejects service-account tokens for activation.
      - name: Activate the Unity license
        run: unity license activate --serial "$UNITY_LICENSE_SERIAL"
        env:
          UNITY_LICENSE_SERIAL: ${{ secrets.UNITY_LICENSE_SERIAL }}

      # Fails in seconds if the machine cannot finish the run at all -- no
      # activatable license, Editor not installed, disk too small, Unity
      # services unreachable -- instead of tens of minutes into a build.
      # Exit 6 is definitive; exit 7 means a required service was unreachable
      # and is worth retrying.
      - name: Preflight
        run: unity doctor --ci

      - name: Test
        run: unity test --report-format junit --output test-results.xml

      # SPLITTING THE SUITE ACROSS PARALLEL JOBS
      #
      # `unity test --shard N/M` runs one deterministic slice, so a matrix
      # finishes in a fraction of the wall-clock time. Do not wire it up by
      # hand: sharding needs a test inventory that only an earlier run can
      # write, and an inventory that goes stale silently stops running your
      # newest tests. Regenerate this file with the matrix already assembled,
      # including the seeding and staleness handling:
      #
      #   unity ci init --shards 4 --overwrite

      - name: Build
        run: unity build --target WebGL --output-path build/

      # A JUnit file needs a reporter action to land in its own check tab; this
      # uploads it so one can consume it, or so it can be read directly.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: './test-results.xml'
          if-no-files-found: warn

      # `unity build` writes a provenance manifest beside the artifact,
      # recording the Editor version, changeset, resolved package set, and git
      # revision that produced it.
      - name: Upload the build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-WebGL
          path: './build/'

      # Return the seat even when the job failed or was cancelled, so
      # ephemeral runners do not leak license activations.
      - name: Return the Unity license
        if: always()
        run: unity license return --yes
